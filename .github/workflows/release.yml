name: Release

# Publishes to npm whenever a version tag is pushed, then creates the GitHub
# Release for the tag with that version's CHANGELOG.md section as its notes.
# The tag must match package.json, e.g. tag v1.2.0 for "version": "1.2.0".
#
# Auth uses npm trusted publishing (OIDC), so no token is stored in GitHub.
# One-time setup on npmjs.com: package @poof-bg/mcp -> Settings -> Trusted
# publisher -> GitHub Actions with organization "poof-bg", repository "mcp",
# workflow filename "release.yml".

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Trusted publishing needs npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@latest

      - name: Check that the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in package.json" >&2
            exit 1
          fi

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm test

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The CHANGELOG section for this version, without its heading.
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
          elif [ -s release-notes.md ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --latest --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --latest --verify-tag
          fi
