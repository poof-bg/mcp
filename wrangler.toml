name = "poof-mcp"
main = "src/worker.ts"
compatibility_date = "2024-12-01"
routes = [
  { pattern = "api.poof.bg/mcp", zone_name = "poof.bg" },
  { pattern = "api.poof.bg/.well-known/oauth-authorization-server", zone_name = "poof.bg" },
  { pattern = "api.poof.bg/.well-known/oauth-protected-resource", zone_name = "poof.bg" },
  { pattern = "api.poof.bg/oauth/*", zone_name = "poof.bg" },
]

[observability]
enabled = true

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "275f6fb71b3e41d8a6c5a626cc8b1104"
preview_id = "c5f85058bc114534a83a54e70122f5fb"
